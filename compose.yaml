services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ctt
      POSTGRES_USER: ctt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ctt -d ctt]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ctt:${POSTGRES_PASSWORD}@db:5432/ctt
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 15
  dashboard:
    build: ./frontend
    ports:
      - 127.0.0.1:5173:80
    depends_on:
      api:
        condition: service_healthy
  telegram:
    profiles: [telegram]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      BACKEND_URL: http://api:8000
    command: [python, -m, app.telegram_worker]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
